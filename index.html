<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 1 – Tailwind</title>
    <!-- Tailwind CSS v4 (browser) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/phosphor-icons@latest/src/css/phosphor.css" />
</head>

<body class="bg-gray-100 min-h-screen">

    <header>
        <header class="w-full bg-green-900 text-white">
            <div class="mx-auto max-w-7xl px-4 md:px-6">
              <!-- topo -->
              <div class="flex flex-wrap items-center justify-between gap-4 py-4">
                <!-- logo -->
                <h1>
                    <a href="/" title="..." class="flex items-center">
                      <img src="assets/img/ifrn_logo_branco.svg" alt="IFRN" class="h-10 w-auto md:h-12" />
                    </a>
                  </h1>
          
                  <span class="hidden text-sm leading-tight md:block md:text-base">
                    Educação, Ciência, Tecnologia em todo o Rio Grande do Norte<br />
                    <span class="font-semibold">Rio Grande do Norte</span>
                  </span>
                </a>
          
                <!-- ações do topo -->
                <div class="flex items-center gap-3">
                  <!-- social -->
                  <ul class="social hidden items-center gap-2 md:flex">
                    <li>
                      <a href="#" class="flex h-9 w-9 items-center justify-center rounded-full border border-white/60 text-white transition hover:bg-white hover:text-green-900" aria-label="Instagram">
                        <svg viewBox="0 0 24 24" class="h-4 w-4 fill-current" aria-hidden="true">
                          <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 0 1 12 7.5zm0 2A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5zM17.8 6.2a1 1 0 1 0 1 1 1 1 0 0 0-1-1z"/>
                        </svg>
                      </a>
                    </li>
                    <li>
                      <a href="#" class="flex h-9 w-9 items-center justify-center rounded-full border border-white/60 text-white transition hover:bg-white hover:text-green-900" aria-label="X">
                        <svg viewBox="0 0 24 24" class="h-4 w-4 fill-current" aria-hidden="true">
                          <path d="M18.9 3H22l-6.9 7.9L23 21h-6.2l-4.9-6.2L6.5 21H3.4l7.4-8.5L1 3h6.3l4.5 5.7L18.9 3zm-1.1 16h1.7L6.3 4.9H4.5L17.8 19z"/>
                        </svg>
                      </a>
                    </li>
                    <li>
                      <a href="#" class="flex h-9 w-9 items-center justify-center rounded-full border border-white/60 text-white transition hover:bg-white hover:text-green-900" aria-label="LinkedIn">
                        <svg viewBox="0 0 24 24" class="h-4 w-4 fill-current" aria-hidden="true">
                          <path d="M6.94 6.5A1.94 1.94 0 1 1 5 4.56 1.94 1.94 0 0 1 6.94 6.5zM5.2 8.6h3.5V20H5.2zM10.2 8.6h3.3v1.6h.1a3.6 3.6 0 0 1 3.2-1.8c3.4 0 4 2.2 4 5V20h-3.5v-5.1c0-1.2 0-2.8-1.7-2.8s-2 1.3-2 2.7V20h-3.5z"/>
                        </svg>
                      </a>
                    </li>
                  </ul>
          
                  <!-- ações -->
                  <ul class="actions hidden items-center gap-2 md:flex">
                    <li>
                      <a href="#" class="flex h-9 w-9 items-center justify-center rounded-full border border-white/60 text-white transition hover:bg-white hover:text-green-900" aria-label="Contraste">
                        <svg viewBox="0 0 24 24" class="h-4 w-4 fill-current" aria-hidden="true">
                          <path d="M12 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9zm0 16.5V4.5a7.5 7.5 0 0 1 0 15z"/>
                        </svg>
                      </a>
                    </li>
                    <li>
                      <a href="#" class="flex h-9 w-9 items-center justify-center rounded-full border border-white/60 text-white transition hover:bg-white hover:text-green-900" aria-label="Modo escuro">
                        <svg viewBox="0 0 24 24" class="h-4 w-4 fill-current" aria-hidden="true">
                          <path d="M20.2 14.7A8.5 8.5 0 0 1 9.3 3.8 9 9 0 1 0 20.2 14.7z"/>
                        </svg>
                      </a>
                    </li>
                  </ul>
          
                  <!-- busca desktop -->
                  <form id="busca" class="hidden items-center md:flex">
                    <label for="search" class="sr-only">Busca</label>
                    <div class="flex items-center rounded-full bg-white px-3 py-2 text-green-900 shadow-sm">
                      <svg viewBox="0 0 24 24" class="mr-2 h-4 w-4 fill-current text-gray-500" aria-hidden="true">
                        <path d="M10.5 4a6.5 6.5 0 1 0 4.1 11.6l4.4 4.4 1.4-1.4-4.4-4.4A6.5 6.5 0 0 0 10.5 4zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/>
                      </svg>
                      <input
                        id="search"
                        type="text"
                        placeholder="Busca"
                        class="w-48 bg-transparent text-sm text-gray-700 placeholder-gray-500 focus:outline-none"
                      />
                    </div>
                  </form>
          
                  <!-- busca mobile -->
                  <button class="md:hidden rounded-full p-2 text-white" aria-label="Buscar">
                    <svg viewBox="0 0 24 24" class="h-5 w-5 fill-current" aria-hidden="true">
                      <path d="M10.5 4a6.5 6.5 0 1 0 4.1 11.6l4.4 4.4 1.4-1.4-4.4-4.4A6.5 6.5 0 0 0 10.5 4zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z"/>
                    </svg>
                  </button>
          
                  <!-- hambúrguer -->
                  <button id="menuToggle" class="md:hidden rounded p-2 text-white" aria-label="Abrir menu">
                    <svg viewBox="0 0 24 24" class="h-6 w-6 fill-current" aria-hidden="true">
                      <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
                    </svg>
                  </button>
                </div>
              </div>
          
              <!-- linha + navegação -->
              <div class="border-t border-white/40 pb-4 pt-4">
                <nav class="flex items-center justify-between gap-4">
                  <ul class="hidden items-center gap-6 md:flex">
                    <li><a href="#" class="font-semibold text-white no-underline transition hover:text-green-200">Processos seletivos</a></li>
                    <li><a href="#" class="font-semibold text-white no-underline transition hover:text-green-200">Cursos</a></li>
                    <li><a href="#" class="font-semibold text-white no-underline transition hover:text-green-200">Campi</a></li>
                    <li><a href="#" class="font-semibold text-white no-underline transition hover:text-green-200">Institucional</a></li>
                    <li><a href="#" class="font-semibold text-white no-underline transition hover:text-green-200">Acesso à Informação</a></li>
                    <li><a href="#" class="font-semibold text-white no-underline transition hover:text-green-200">Eventos</a></li>
                    <li><a href="#" class="font-semibold text-white no-underline transition hover:text-green-200">Serviços</a></li>
                  </ul>
                </nav>
              </div>
            </div>
          </header>
    </header>

</body>

</html>
